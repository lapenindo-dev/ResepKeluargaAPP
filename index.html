<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resep Keluarga">
  <meta name="theme-color" content="#FF8C42">
  <title>Resep Keluarga - Warisan Makan Keluarga</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #FF8C42;
      --secondary: #FF6B6B;
      --accent: #FFF5F0;
      --text-dark: #5D4E37;
      --text-light: #8B7355;
      --success: #4CAF50;
      --error: #E74C3C;
      --border: #E8D5C4;
      --shadow: 0 2px 8px rgba(93, 78, 55, 0.1);
      --shadow-lg: 0 4px 16px rgba(93, 78, 55, 0.15);
    }
    
    html, body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFF8F5 100%);
      color: var(--text-dark);
      line-height: 1.8;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    
    .auth-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    
    .auth-container.show {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .auth-box {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
    
    .auth-title {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-dark);
      margin-bottom: 8px;
      text-align: center;
    }
    
    .auth-subtitle {
      font-size: 14px;
      color: var(--text-light);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    .auth-input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    
    .auth-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
    }
    
    #authStatus {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    
    #authStatus.show { display: block; }
    #authStatus.error { background: rgba(231, 76, 60, 0.1); color: var(--error); }
    #authStatus.success { background: rgba(76, 175, 80, 0.1); color: var(--success); }
    
    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      touch-action: manipulation;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      margin-top: 12px;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-primary:active {
      transform: scale(0.98);
      background: #E67A30;
    }
    
    .btn-secondary {
      border: 2px solid var(--primary);
      color: var(--primary);
      background: transparent;
    }
    
    .auth-toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-light);
    }
    
    .auth-toggle button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px;
    }
    
    .app-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .app-container.show {
      display: flex;
      flex-direction: column;
    }
    
    .content-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFF8F5 100%);
    }
    
    .page {
      display: none;
      animation: slideIn 0.3s ease-out;
    }
    
    .page.active {
      display: block;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .home-hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 32px 20px;
      border-radius: 20px;
      margin: 20px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    
    .home-emoji { font-size: 48px; margin-bottom: 12px; }
    .home-greeting { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .home-tagline { font-size: 14px; opacity: 0.9; line-height: 1.6; }
    
    .home-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px;
      margin-bottom: 0;
    }
    
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    
    .stat-number { font-size: 28px; font-weight: bold; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; font-weight: 500; }
    
    .cta-section { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 12px; }
    
    .cta-primary {
      background: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow);
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .cta-primary:active { transform: scale(0.98); background: #E67A30; }
    
    .recipe-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .recipe-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 20px;
    }
    
    .recipe-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .recipe-card:active { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    
    .recipe-image { width: 100%; height: 180px; background: var(--accent); object-fit: cover; }
    .recipe-info { padding: 16px; }
    .recipe-name { font-size: 18px; font-weight: bold; color: var(--text-dark); margin-bottom: 8px; }
    .recipe-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-light); }
    
    .wizard-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
      padding: 24px 20px;
      border-radius: 16px;
      margin: 20px 20px 0;
      text-align: center;
    }
    
    .wizard-step-num { font-size: 12px; opacity: 0.9; margin-bottom: 8px; }
    .wizard-title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
    .wizard-subtitle { font-size: 14px; opacity: 0.95; }
    
    .wizard-section {
      background: white;
      padding: 24px 20px;
      margin: 12px 20px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    
    .wizard-field { margin-bottom: 20px; }
    .wizard-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
    
    .wizard-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    
    .wizard-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
    }
    
    .photo-button {
      width: 100%;
      padding: 32px 16px;
      border: 3px dashed var(--primary);
      border-radius: 16px;
      background: rgba(255, 140, 66, 0.05);
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 16px;
      font-family: inherit;
      margin: 0;
    }
    
    .photo-icon { font-size: 40px; margin-bottom: 8px; }
    
    .wizard-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
    }
    
    .btn-nav {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      font-family: inherit;
    }
    
    .btn-back { background: white; color: var(--text-dark); border: 2px solid var(--border); }
    .btn-next { background: var(--primary); color: white; }
    .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: white;
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }
    
    .nav-item {
      padding: 12px 8px;
      text-align: center;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 11px;
      transition: all 0.3s ease;
      border-top: 3px solid transparent;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    
    .nav-item.active {
      color: var(--primary);
      border-top-color: var(--primary);
      background: rgba(255, 140, 66, 0.05);
    }
    
    .nav-emoji { font-size: 24px; margin-bottom: 4px; }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    
    .empty-emoji { font-size: 64px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: bold; color: var(--text-dark); margin-bottom: 8px; }
    
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--accent);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media (min-width: 480px) {
      .recipe-grid { grid-template-columns: 1fr 1fr; }
      .home-stats { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="auth-container show" id="authContainer">
  <div class="auth-box">
    <div class="auth-title">Resep Keluarga</div>
    <div class="auth-subtitle">Simpan resep Mama hari ini,<br>sebelum hanya tersisa kenangan.</div>
    
    <div id="authStatus"></div>
    
    <div id="loginForm">
      <input type="email" id="loginEmail" class="auth-input" placeholder="Email Anda" autocomplete="email">
      <input type="password" id="loginPassword" class="auth-input" placeholder="Password" autocomplete="current-password">
      <button class="btn btn-primary" onclick="loginEmail()">Masuk</button>
      <button class="btn btn-secondary" onclick="loginGoogle()">🔵 Masuk dengan Google</button>
      <div class="auth-toggle">
        Belum punya akun? <button onclick="toggleAuthForm()">Daftar di sini</button>
      </div>
    </div>
    
    <div id="signupForm" style="display:none;">
      <input type="text" id="signupName" class="auth-input" placeholder="Nama Anda">
      <input type="email" id="signupEmail" class="auth-input" placeholder="Email" autocomplete="email">
      <input type="password" id="signupPassword" class="auth-input" placeholder="Password (min 6 karakter)">
      <button class="btn btn-primary" onclick="signupEmail()">Buat Akun</button>
      <button class="btn btn-secondary" onclick="signupGoogle()">🔵 Daftar dengan Google</button>
      <div class="auth-toggle">
        Sudah punya akun? <button onclick="toggleAuthForm()">Masuk di sini</button>
      </div>
    </div>
  </div>
</div>

<div class="app-container" id="appContainer">
  <div class="content-area" id="contentArea">
    
    <div class="page active" id="homePage">
      <div class="home-hero">
        <div class="home-emoji">❤️</div>
        <div class="home-greeting">Halo, <span id="userName">Ibu</span>!</div>
        <div class="home-tagline">Setiap resep Mama adalah cerita keluarga.<br>Mari simpan warisan makan Anda.</div>
      </div>
      
      <div class="home-stats">
        <div class="stat-card">
          <div class="stat-number" id="statRecipes">0</div>
          <div class="stat-label">Resep Tersimpan</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statRating">0</div>
          <div class="stat-label">Rating Tertinggi</div>
        </div>
      </div>
      
      <div class="cta-section">
        <button class="cta-primary" onclick="goToPage('add')">
          📸 Ambil Foto Resep
        </button>
        <button class="cta-primary" onclick="goToPage('recipes')" style="background: white; color: var(--primary); border: 2px solid var(--primary);">
          🔥 Lihat Resep Favorit
        </button>
      </div>
    </div>
    
    <div class="page" id="recipesPage">
      <div class="recipe-header">
        <div style="font-size: 26px; font-weight: bold; margin-bottom: 4px;">📖 Resep Anda</div>
        <div>Koleksi cerita makan keluarga</div>
      </div>
      <div class="recipe-grid" id="recipeGrid">
        <div class="empty-state">
          <div class="empty-emoji">📷</div>
          <div class="empty-title">Belum ada resep</div>
        </div>
      </div>
    </div>
    
    <div class="page" id="addPage"></div>
    
  </div>
  
  <div class="bottom-nav">
    <button class="nav-item active" onclick="goToPage('home')">
      <div class="nav-emoji">🏠</div>
      <div>Beranda</div>
    </button>
    <button class="nav-item" onclick="goToPage('recipes')">
      <div class="nav-emoji">📖</div>
      <div>Resep</div>
    </button>
    <button class="nav-item" onclick="goToPage('add')">
      <div class="nav-emoji">➕</div>
      <div>Tambah</div>
    </button>
    <button class="nav-item" onclick="goToPage('jadwal')">
      <div class="nav-emoji">📅</div>
      <div>Jadwal</div>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================
  // INIT SUPABASE (ONLY ONCE)
  // ============================================
  const SUPABASE_URL = 'https://tqexfiohtirjncguxjkx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DGbM2P7HfKFXQxUwf1zpxQ_FydGbvWe';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  // ============================================
  // STATE
  // ============================================
  let currentUser = null;
  let recipes = [];
  let wizard = { step: 1, photo: null, name: '', duration: 0, porsi: 0, rating: 0 };
  
  // ============================================
  // AUTH FUNCTIONS
  // ============================================
  async function loginEmail() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    if (!email || !password) {
      showAuthStatus('Email dan password harus diisi', 'error');
      return;
    }
    
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      showAuthStatus('Login gagal: ' + error.message, 'error');
    }
  }
  
  async function signupEmail() {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    
    if (!name || !email || !password) {
      showAuthStatus('Semua field harus diisi', 'error');
      return;
    }
    
    if (password.length < 6) {
      showAuthStatus('Password minimal 6 karakter', 'error');
      return;
    }
    
    const { error } = await db.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    });
    
    if (error) {
      showAuthStatus('Signup gagal: ' + error.message, 'error');
    } else {
      showAuthStatus('Akun berhasil dibuat! Silakan login.', 'success');
      setTimeout(() => toggleAuthForm(), 1500);
    }
  }
  
  async function loginGoogle() {
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if (error) showAuthStatus('Google login gagal', 'error');
  }
  
  async function signupGoogle() {
    await loginGoogle();
  }
  
  async function logout() {
    if (confirm('Yakin mau logout?')) {
      await db.auth.signOut();
    }
  }
  
  function toggleAuthForm() {
    const login = document.getElementById('loginForm');
    const signup = document.getElementById('signupForm');
    login.style.display = login.style.display === 'none' ? 'block' : 'none';
    signup.style.display = signup.style.display === 'none' ? 'block' : 'none';
  }
  
  function showAuthStatus(msg, type) {
    const el = document.getElementById('authStatus');
    el.textContent = msg;
    el.className = 'show ' + type;
  }
  
  // ============================================
  // NAVIGATION
  // ============================================
  function goToPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(name + 'Page').classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    event.target.closest('.nav-item')?.classList.add('active');
    
    if (name === 'recipes') loadRecipes();
    if (name === 'add') showWizardStep(1);
    
    window.scrollTo(0, 0);
  }
  
  // ============================================
  // RECIPES
  // ============================================
  async function loadRecipes() {
    if (!currentUser) return;
    
    const { data, error } = await db
      .from('recipes')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error:', error);
      return;
    }
    
    recipes = data || [];
    updateStats();
    renderRecipes();
  }
  
  function updateStats() {
    document.getElementById('statRecipes').textContent = recipes.length;
    const maxRating = recipes.length ? Math.max(...recipes.map(r => r.rating_keluarga || 0)) : 0;
    document.getElementById('statRating').textContent = maxRating;
  }
  
  function renderRecipes() {
    const grid = document.getElementById('recipeGrid');
    
    if (!recipes.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-emoji">📷</div><div class="empty-title">Belum ada resep</div></div>`;
      return;
    }
    
    grid.innerHTML = recipes.map(r => `
      <div class="recipe-card">
        ${r.foto_url ? `<img src="${r.foto_url}" class="recipe-image" onerror="this.style.backgroundColor='var(--accent)'">` : `<div class="recipe-image"></div>`}
        <div class="recipe-info">
          <div class="recipe-name">${r.nama_resep || 'Resep'}</div>
          <div class="recipe-meta">
            ${r.rating_keluarga ? `⭐ ${r.rating_keluarga}` : ''}
            ${r.durasi_menit ? `⏱️ ${r.durasi_menit}m` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }
  
  // ============================================
  // WIZARD
  // ============================================
  function showWizardStep(step) {
    wizard.step = step;
    const container = document.getElementById('addPage');
    
    if (step === 1) {
      container.innerHTML = `
        <div class="wizard-header">
          <div class="wizard-step-num">Langkah 1 dari 5</div>
          <div class="wizard-title">📸 Ambil Foto Resep</div>
          <div class="wizard-subtitle">Pastikan cahaya cukup</div>
        </div>
        
        <div class="wizard-section">
          <button class="photo-button" onclick="uploadPhoto()">
            <div class="photo-icon">📁</div>
            <div>Pilih Foto dari HP</div>
          </button>
          ${wizard.photo ? `
            <div style="margin-top: 16px; text-align: center;">
              <img src="${wizard.photo}" style="width: 100%; border-radius: 12px; max-height: 300px;">
              <button class="btn-nav" style="width: 100%; margin-top: 12px; background: var(--secondary); color: white; border: none;" onclick="clearPhoto()">Ambil Ulang</button>
            </div>
          ` : ''}
        </div>
        
        <div class="wizard-nav">
          <button class="btn-nav btn-back" onclick="goToPage('home')">← Batal</button>
          <button class="btn-nav btn-next" onclick="showWizardStep(2)" ${!wizard.photo ? 'disabled' : ''}>Lanjut →</button>
        </div>
      `;
    } else if (step === 2) {
      container.innerHTML = `
        <div class="wizard-header">
          <div class="wizard-step-num">Langkah 2 dari 5</div>
          <div class="wizard-title">✨ AI Baca Resep</div>
        </div>
        
        <div class="wizard-section">
          <div style="text-align: center; padding: 40px 20px;">
            <div class="spinner" style="margin: 0 auto; margin-bottom: 20px;"></div>
            <div style="color: var(--text-light);">Sebentar lagi... (5-10 detik)</div>
          </div>
        </div>
        
        <div class="wizard-nav">
          <button class="btn-nav btn-back" onclick="showWizardStep(1)">← Kembali</button>
          <button class="btn-nav btn-next" onclick="showWizardStep(3)">Lanjut →</button>
        </div>
      `;
      setTimeout(() => {}, 2000);
    } else if (step === 3) {
      container.innerHTML = `
        <div class="wizard-header">
          <div class="wizard-step-num">Langkah 3 dari 5</div>
          <div class="wizard-title">📝 Info Dasar</div>
        </div>
        
        <div class="wizard-section">
          <div class="wizard-field">
            <label class="wizard-label">Nama Resep</label>
            <input type="text" class="wizard-input" id="wName" placeholder="Bakso" value="${wizard.name}" autofocus>
          </div>
          <div class="wizard-field">
            <label class="wizard-label">⏱️ Durasi (menit)</label>
            <input type="number" class="wizard-input" id="wDur" placeholder="30" value="${wizard.duration}" min="1">
          </div>
          <div class="wizard-field">
            <label class="wizard-label">👥 Porsi</label>
            <input type="number" class="wizard-input" id="wPor" placeholder="4" value="${wizard.porsi}" min="1">
          </div>
          <div class="wizard-field">
            <label class="wizard-label">⭐ Rating (0-5)</label>
            <input type="number" class="wizard-input" id="wRat" min="0" max="5" placeholder="5" value="${wizard.rating}">
          </div>
        </div>
        
        <div class="wizard-nav">
          <button class="btn-nav btn-back" onclick="showWizardStep(1)">← Kembali</button>
          <button class="btn-nav btn-next" onclick="saveStep3()">Lanjut →</button>
        </div>
      `;
    } else if (step === 4) {
      container.innerHTML = `
        <div class="wizard-header">
          <div class="wizard-step-num">Langkah 4 dari 5</div>
          <div class="wizard-title">📌 Detail Opsional</div>
        </div>
        
        <div class="wizard-section">
          <p style="margin-bottom: 16px; color: var(--text-light); font-size: 14px;">Bahan, cara, & catatan (opsional)</p>
        </div>
        
        <div class="wizard-nav">
          <button class="btn-nav btn-back" onclick="showWizardStep(3)">← Kembali</button>
          <button class="btn-nav btn-next" onclick="showWizardStep(5)">Lanjut →</button>
        </div>
      `;
    } else if (step === 5) {
      container.innerHTML = `
        <div class="wizard-header">
          <div class="wizard-step-num">Langkah 5 dari 5</div>
          <div class="wizard-title">✨ Konfirmasi</div>
        </div>
        
        <div class="wizard-section">
          <img src="${wizard.photo}" style="width: 100%; border-radius: 12px; max-height: 250px; margin-bottom: 16px;">
          <div style="background: var(--accent); padding: 16px; border-radius: 12px;">
            <div style="margin-bottom: 12px;">
              <div style="font-size: 12px; color: var(--text-light);">Nama Resep</div>
              <div style="font-size: 18px; font-weight: bold;">${wizard.name}</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div>
                <div style="font-size: 12px; color: var(--text-light);">Durasi</div>
                <div style="font-size: 16px; font-weight: 600;">${wizard.duration}m</div>
              </div>
              <div>
                <div style="font-size: 12px; color: var(--text-light);">Porsi</div>
                <div style="font-size: 16px; font-weight: 600;">${wizard.porsi}</div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="wizard-nav" style="grid-template-columns: 1fr;">
          <button class="btn-nav btn-back" onclick="showWizardStep(3)" style="grid-column: 1;">← Edit</button>
          <button class="btn-nav btn-next" onclick="saveRecipe()" style="grid-column: 1;">💾 Simpan</button>
        </div>
      `;
    }
  }
  
  function uploadPhoto() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        wizard.photo = evt.target.result;
        showWizardStep(1);
      };
      reader.readAsDataURL(e.target.files[0]);
    };
    input.click();
  }
  
  function clearPhoto() {
    wizard.photo = null;
    showWizardStep(1);
  }
  
  function saveStep3() {
    wizard.name = document.getElementById('wName').value.trim();
    wizard.duration = parseInt(document.getElementById('wDur').value) || 0;
    wizard.porsi = parseInt(document.getElementById('wPor').value) || 0;
    wizard.rating = parseInt(document.getElementById('wRat').value) || 0;
    
    if (!wizard.name) {
      alert('Nama resep harus diisi!');
      return;
    }
    
    showWizardStep(4);
  }
  
  async function saveRecipe() {
    if (!currentUser || !wizard.photo || !wizard.name) {
      alert('Data tidak lengkap!');
      return;
    }
    
    const { error } = await db.from('recipes').insert({
      user_id: currentUser.id,
      nama_resep: wizard.name,
      durasi_menit: wizard.duration,
      porsi: wizard.porsi,
      rating_keluarga: wizard.rating,
      foto_url: wizard.photo,
      sumber_resep: 'Manual'
    });
    
    if (error) {
      alert('Error: ' + error.message);
      return;
    }
    
    alert('✅ Resep berhasil disimpan!');
    wizard = { step: 1, photo: null, name: '', duration: 0, porsi: 0, rating: 0 };
    goToPage('home');
    loadRecipes();
  }
  
  // ============================================
  // INIT
  // ============================================
  async function init() {
    const { data } = await db.auth.getSession();
    currentUser = data?.session?.user || null;
    
    if (currentUser) {
      document.getElementById('authContainer').classList.remove('show');
      document.getElementById('appContainer').classList.add('show');
      document.getElementById('userName').textContent = currentUser.user_metadata?.full_name || 'Ibu';
      loadRecipes();
    }
    
    db.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      if (currentUser) {
        document.getElementById('authContainer').classList.remove('show');
        document.getElementById('appContainer').classList.add('show');
        document.getElementById('userName').textContent = currentUser.user_metadata?.full_name || 'Ibu';
        loadRecipes();
      } else {
        document.getElementById('authContainer').classList.add('show');
        document.getElementById('appContainer').classList.remove('show');
      }
    });
  }
  
  init();
</script>

</body>
</html>
